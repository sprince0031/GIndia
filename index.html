<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GIndia — Geographical Indications of India | Interactive 3D Exhibit</title>
    <meta name="description" content="An interactive 3D art exhibition celebrating India's rich geographical indications, artisanal craftsmanship, and agricultural heritage." />
    <meta name="theme-color" content="#F9F6F0" />
    
    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="bg-canvas text-ink antialiased overflow-hidden select-none">
    <div id="app" class="relative w-screen h-screen overflow-hidden flex flex-col justify-between">
      
      <!-- Top Exhibition Header -->
      <header class="absolute top-0 left-0 right-0 z-30 flex items-center justify-between px-6 py-4 pointer-events-none">
        <div class="pointer-events-auto flex items-baseline gap-3">
          <h1 class="font-serif text-2xl md:text-3xl font-bold tracking-tight text-ink">GIndia</h1>
          <span class="hidden sm:inline-block text-xs uppercase tracking-widest text-ink-muted border-l border-ink/20 pl-3">Geographical Indications of India</span>
        </div>
        
        <div class="pointer-events-auto flex items-center gap-3">
          <button id="btn-search" class="glass-btn flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium" title="Search GI Products (Ctrl+K)">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <span class="hidden md:inline">Search GI Products</span>
          </button>
          <button id="btn-stats" class="glass-btn flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium" title="Exhibition Statistics">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            <span class="hidden md:inline">Exhibition Stats</span>
          </button>
        </div>
      </header>

      <!-- 3D Three.js WebGL Canvas Container -->
      <div id="canvas-container" class="absolute inset-0 w-full h-full z-0 cursor-grab active:cursor-grabbing"></div>

      <!-- 2D Fallback Map Container (Non-WebGL environments) -->
      <div id="fallback-container" class="absolute inset-0 w-full h-full z-0 hidden flex items-center justify-center p-8 overflow-hidden">
        <div id="fallback-svg-wrapper" class="w-full h-full max-w-4xl max-h-[85vh] flex items-center justify-center"></div>
      </div>

      <!-- Dynamic Bezier Tracer Rays Overlay (SVG) -->
      <svg id="tracer-svg-layer" class="absolute inset-0 w-full h-full pointer-events-none z-20"></svg>

      <!-- Left Vertical Floating Exhibition Tool Dock -->
      <aside id="tool-dock" class="absolute left-6 top-1/2 -translate-y-1/2 z-30 flex flex-col gap-2 glass-dock p-2 rounded-2xl shadow-xl">
        <button id="dock-tour-toggle" class="dock-btn group" title="Toggle Auto-Tour Kiosk Mode">
          <svg id="dock-tour-play-icon" class="w-5 h-5 text-ink group-hover:text-terracotta transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <svg id="dock-tour-pause-icon" class="w-5 h-5 text-terracotta hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span class="dock-tooltip">Auto Tour</span>
        </button>

        <button id="dock-speech-toggle" class="dock-btn group" title="Toggle Audio Narration">
          <svg id="dock-speech-on-icon" class="w-5 h-5 text-ink group-hover:text-terracotta transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
          <svg id="dock-speech-off-icon" class="w-5 h-5 text-ink-muted hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"></path></svg>
          <span class="dock-tooltip">Audio Narration</span>
        </button>

        <div class="w-full h-px bg-ink/10 my-1"></div>

        <button id="dock-filter-toggle" class="dock-btn group" title="Filter by Category">
          <svg class="w-5 h-5 text-ink group-hover:text-terracotta transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
          <span class="dock-tooltip">Categories</span>
        </button>

        <button id="dock-camera-reset" class="dock-btn group" title="Reset Camera View">
          <svg class="w-5 h-5 text-ink group-hover:text-terracotta transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span class="dock-tooltip">Reset View</span>
        </button>
      </aside>

      <!-- Category Filter Flyout Menu -->
      <div id="category-filter-panel" class="absolute left-20 top-1/2 -translate-y-1/2 z-40 hidden glass-panel p-4 rounded-2xl shadow-2xl w-64">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-xs uppercase tracking-wider font-semibold text-ink-muted">Filter Category</h3>
          <button id="btn-close-filter" class="text-ink-muted hover:text-ink text-sm font-bold">×</button>
        </div>
        <div class="flex flex-col gap-1.5" id="category-filter-list">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Spatial Info Card Container (Desktop / Large Viewports) -->
      <main id="info-card-container" class="absolute inset-0 pointer-events-none z-20 flex justify-between p-6 sm:p-10"></main>

      <!-- Bottom Audio / Tour Narration Bar -->
      <footer id="narration-bar" class="absolute bottom-6 left-1/2 -translate-x-1/2 z-30 hidden glass-panel px-5 py-3 rounded-full shadow-lg items-center gap-4 max-w-xl w-[90vw]">
        <div class="w-2.5 h-2.5 rounded-full bg-terracotta animate-pulse"></div>
        <div class="flex-1 overflow-hidden">
          <div id="narration-caption" class="text-xs text-ink truncate font-medium">Exhibition Auto-Tour Active</div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-narration-prev" class="p-1 text-ink hover:text-terracotta" title="Previous State">⏮</button>
          <button id="btn-narration-pause" class="p-1 text-ink hover:text-terracotta" title="Pause Tour">⏸</button>
          <button id="btn-narration-next" class="p-1 text-ink hover:text-terracotta" title="Next State">⏭</button>
        </div>
      </footer>

      <!-- Modals Layer (Stats & Search) -->
      <div id="modal-container" class="fixed inset-0 z-50 hidden bg-black/40 backdrop-blur-sm flex items-center justify-center p-4"></div>

    </div>

    <!-- Application Script Entrypoint -->
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
